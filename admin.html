<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高雄高商註冊組升學報名 - 後台管理控制台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #212529; color: #f8f9fa; padding-top: 40px; padding-bottom: 40px; }
    .admin-card { max-width: 750px; margin: 0 auto; background: #2c3035; padding: 35px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .channel-row { background-color: #343a40; padding: 12px 20px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .form-switch .form-check-input { width: 3em; height: 1.5em; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="admin-card">
    
    <!-- 登入區域 -->
    <div id="loginSection">
      <h3 class="text-center text-warning fw-bold mb-4">註冊組長後台管理登入</h3>
      <div class="mb-3">
        <label class="form-label">請輸入管理密碼：</label>
        <input type="password" class="form-control form-control-lg" id="adminPassword" placeholder="預設密碼請於 Code.gs 修改">
      </div>
      <button class="btn btn-warning w-100 btn-lg fw-bold" onclick="adminLogin()">登入控制台</button>
      <div id="loginMsg" class="mt-3"></div>
    </div>

    <!-- 管理控制台區域 (預設隱藏) -->
    <div id="controlPanel" style="display: none;">
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h3 class="text-warning fw-bold mb-0">升學管道開放管理</h3>
        <button class="btn btn-outline-light btn-sm" onclick="location.reload()">安全登出</button>
      </div>

      <!-- 學年度選擇 -->
      <div class="row g-3 align-items-center mb-4">
        <div class="col-auto">
          <label class="col-form-label fw-bold">選擇管理學年度：</label>
        </div>
        <div class="col-auto">
          <select class="form-select form-select-lg bg-dark text-light border-secondary" id="yearSelect" onchange="fetchYearConfig()">
            <!-- JS 動態生成學年度選單 -->
          </select>
        </div>
        <div class="col-auto ms-auto">
          <button class="btn btn-outline-info btn-sm" onclick="addNewYearPrompt()">+ 增加新學年度</button>
        </div>
      </div>

      <!-- 管道清單區 -->
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="fw-bold text-info mb-0">各升學管道開放狀態：</h5>
          <button class="btn btn-sm btn-outline-success" onclick="addCustomChannelPrompt()">+ 新增自訂管道</button>
        </div>
        <div id="channelsContainer" class="mt-3">
          <!-- 動態載入管道清單列表 -->
        </div>
      </div>

      <!-- 儲存按鈕 -->
      <button class="btn btn-success btn-lg w-100 fw-bold" id="saveBtn" onclick="saveConfig()">儲存並發布設定</button>
      <div id="statusMsg" class="mt-3"></div>
    </div>

  </div>
</div>

<script>
  // ------------------------------------------------------------------
  // 請貼上您在 GAS 部署獲得的網頁應用程式 URL
  // ------------------------------------------------------------------
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby0CNwZEKY7GIPm58gX_VLeMbTFThsgdNtCYQmdH2q1j-FRd4dL59lGTfA_i1CFVhWR3Q/exec"; 
  // ------------------------------------------------------------------

  let currentPassword = "";
  let currentChannelsData = [];

  // 初始化學年度下拉選單 (自動抓今年前後學年度)
  function initYearDropdown() {
    const yearSelect = document.getElementById('yearSelect');
    const today = new Date();
    let currYear = today.getFullYear() - 1911;
    if (today.getMonth() + 1 < 8) { currYear -= 1; }

    yearSelect.innerHTML = '';
    for (let y = currYear - 1; y <= currYear + 2; y++) {
      const opt = document.createElement('option');
      opt.value = y + "學年度";
      opt.innerText = y + "學年度";
      if (y === currYear) opt.selected = true;
      yearSelect.appendChild(opt);
    }
  }

  // 登入驗證
  async function adminLogin() {
    const pwdInput = document.getElementById('adminPassword');
    const loginMsg = document.getElementById('loginMsg');
    currentPassword = pwdInput.value.trim();

    if (!currentPassword) { alert("請輸入密碼！"); return; }

    loginMsg.innerHTML = '<div class="text-info">正在驗證身分...</div>';

    initYearDropdown();
    await fetchYearConfig();
  }

  // 取得選定學年度的管道設定
  async function fetchYearConfig() {
    const selectedYear = document.getElementById('yearSelect').value;
    const loginMsg = document.getElementById('loginMsg');
    const statusMsg = document.getElementById('statusMsg');

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'getAdminConfig',
          password: currentPassword,
          academicYear: selectedYear
        })
      });

      const res = await response.json();

      if (res.status === 'success') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('controlPanel').style.display = 'block';
        loginMsg.innerHTML = '';
        
        currentChannelsData = res.channels;
        renderChannelsList();
      } else {
        loginMsg.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
      }
    } catch (err) {
      alert("連線失敗：" + err.message);
    }
  }

  // 渲染管道清單 Switch 開關
  function renderChannelsList() {
    const container = document.getElementById('channelsContainer');
    container.innerHTML = '';

    currentChannelsData.forEach((ch, idx) => {
      const row = document.createElement('div');
      row.className = 'channel-row';
      row.innerHTML = `
        <span class="fs-5 fw-bold">${ch.name}</span>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="switch_${idx}" ${ch.enabled ? 'checked' : ''} onchange="toggleChannel(${idx}, this.checked)">
          <label class="form-check-label ms-2" for="switch_${idx}">${ch.enabled ? '<span class="text-success fw-bold">開放中</span>' : '<span class="text-muted">已關閉</span>'}</label>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function toggleChannel(idx, isChecked) {
    currentChannelsData[idx].enabled = isChecked;
    renderChannelsList();
  }

  // 新增自訂管道
  function addCustomChannelPrompt() {
    const newName = prompt("請輸入欲新增的升學管道名稱（例如：校內繁星推薦、身心障礙甄試）：");
    if (newName && newName.trim()) {
      const name = newName.trim();
      if (currentChannelsData.some(c => c.name === name)) {
        alert("該管道名稱已存在！");
        return;
      }
      currentChannelsData.push({ name: name, enabled: true });
      renderChannelsList();
    }
  }

  // 增加新學年度選單
  function addNewYearPrompt() {
    const yearStr = prompt("請輸入欲新增的民國學年度數字（例如：117）：");
    if (yearStr && !isNaN(yearStr)) {
      const newYearText = yearStr.trim() + "學年度";
      const yearSelect = document.getElementById('yearSelect');
      const opt = document.createElement('option');
      opt.value = newYearText;
      opt.innerText = newYearText;
      opt.selected = true;
      yearSelect.appendChild(opt);
      fetchYearConfig();
    }
  }

  // 儲存設定至 GAS
  async function saveConfig() {
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');
    const selectedYear = document.getElementById('yearSelect').value;

    saveBtn.disabled = true;
    saveBtn.innerText = '設定儲存中...';
    statusMsg.innerHTML = '';

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'saveAdminConfig',
          password: currentPassword,
          academicYear: selectedYear,
          channels: currentChannelsData
        })
      });

      const res = await response.json();

      if (res.status === 'success') {
        statusMsg.innerHTML = `<div class="alert alert-success fs-5 text-center">${res.message}</div>`;
      } else {
        statusMsg.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
      }
    } catch (err) {
      statusMsg.innerHTML = `<div class="alert alert-danger">儲存失敗：${err.message}</div>`;
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerText = '儲存並發布設定';
    }
  }
</script>

</body>
</html>
