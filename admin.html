<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高雄高商升學報名 - 後台管理控制台</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { 
      background-color: #1e2227; 
      color: #f8f9fa; 
      padding-top: 40px; 
      padding-bottom: 50px; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
    }
    .admin-card { 
      max-width: 850px; 
      margin: 0 auto; 
      background: #2b3036; 
      padding: 35px; 
      border-radius: 14px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
      border: 1px solid #3d444d; 
      position: relative;
    }
    .channel-row { 
      background-color: #343a40; 
      padding: 12px 18px; 
      border-radius: 10px; 
      margin-bottom: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-left: 5px solid #6c757d; 
      transition: all 0.2s; 
    }
    .channel-row.active-row { 
      border-left-color: #198754; 
      background-color: #2c3830; 
    }
    .form-switch .form-check-input { 
      width: 3em; 
      height: 1.5em; 
      cursor: pointer; 
    }
    .active-year-badge { 
      background-color: #ffc107; 
      color: #000; 
      font-weight: bold; 
      padding: 4px 10px; 
      border-radius: 12px; 
      font-size: 0.85rem; 
    }
    .loading-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(30, 34, 39, 0.85);
      border-radius: 14px;
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .loading-overlay.show { display: flex; }
    .btn-action { padding: 0.25rem 0.5rem; font-size: 0.875rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="admin-card">
    
    <!-- 全局讀取遮罩 -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-border text-warning mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
      <div class="text-light fw-bold" id="loadingText">資料處理中，請稍候...</div>
    </div>

    <!-- 1. 登入區域 -->
    <div id="loginSection">
      <h3 class="text-center text-warning fw-bold mb-4">
        <i class="bi bi-shield-lock-fill me-2"></i>註冊組長後台管理登入
      </h3>
      <div class="mb-3">
        <label for="adminPassword" class="form-label">請輸入管理密碼：</label>
        <input type="password" class="form-control form-control-lg bg-dark text-light border-secondary" id="adminPassword" placeholder="請輸入 Code.gs 設定之密碼" onkeypress="if(event.key==='Enter') adminLogin()">
      </div>
      <button class="btn btn-warning w-100 btn-lg fw-bold" onclick="adminLogin()">
        <i class="bi bi-box-arrow-in-right me-1"></i> 登入控制台
      </button>
      <div id="loginMsg" class="mt-3"></div>
    </div>

    <!-- 2. 控制台主頁面 -->
    <div id="controlPanel" style="display: none;">
      
      <!-- 頂部頁籤與安全登出 -->
      <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
        <div>
          <h3 class="text-warning fw-bold mb-1">升學管道開放管理</h3>
          <span class="text-muted small">前台目前開放學年度：<span id="currentActiveYearBadge" class="active-year-badge">讀取中...</span></span>
        </div>
        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
          <i class="bi bi-power me-1"></i>安全登出
        </button>
      </div>

      <!-- 學年度切換與設定 -->
      <div class="card bg-dark border-secondary p-3 mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-auto">
            <label for="yearSelect" class="col-form-label fw-bold">管理學年度：</label>
          </div>
          <div class="col-md-auto">
            <select class="form-select form-select-lg bg-dark text-light border-secondary" id="yearSelect" onchange="onYearChange()">
            </select>
          </div>
          <div class="col-md-auto">
            <button class="btn btn-warning fw-bold" onclick="setAsActiveYear()">
              <i class="bi bi-star-fill me-1"></i>設為前台開放
            </button>
          </div>
          <div class="col-md-auto ms-md-auto d-flex gap-2">
            <button class="btn btn-outline-info btn-sm" onclick="addNewYearPrompt()">
              <i class="bi bi-plus-circle me-1"></i>新增學年度
            </button>
            <button class="btn btn-outline-danger btn-sm" onclick="deleteCurrentYearConfig()" title="刪除當前學年度設定">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- 管道設定列表 -->
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="d-flex align-items-center gap-2">
            <h5 class="fw-bold text-info mb-0">【<span id="editingYearTitle">--</span>】管道開放與科目細項設定：</h5>
            <span id="unsavedBadge" class="badge bg-danger" style="display: none;">未儲存變更</span>
          </div>
          <button class="btn btn-sm btn-outline-success" onclick="addCustomChannelPrompt()">
            <i class="bi bi-plus-lg me-1"></i>新增自訂管道
          </button>
        </div>
        
        <div id="channelsContainer">
          <!-- 動態載入管道列表 -->
        </div>
      </div>

      <!-- 儲存發布按鈕 -->
      <button class="btn btn-success btn-lg w-100 fw-bold shadow" id="saveBtn" onclick="saveConfig()">
        <i class="bi bi-cloud-upload me-1"></i>儲存並發布此學年度設定
      </button>
      <div id="statusMsg" class="mt-3"></div>

    </div>

  </div>
</div>

<script>
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby0CNwZEKY7GIPm58gX_VLeMbTFThsgdNtCYQmdH2q1j-FRd4dL59lGTfA_i1CFVhWR3Q/exec"; 

  let currentPassword = "";
  let currentChannelsData = [];
  let globalActiveYear = "";
  let isDirty = false;

  window.addEventListener('DOMContentLoaded', () => {
    const savedPwd = sessionStorage.getItem('adminPwd');
    if (savedPwd) {
      document.getElementById('adminPassword').value = savedPwd;
      adminLogin();
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (isDirty) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function toggleLoading(show, text = "資料處理中，請稍候...") {
    const overlay = document.getElementById('loadingOverlay');
    document.getElementById('loadingText').innerText = text;
    if (show) overlay.classList.add('show');
    else overlay.classList.remove('show');
  }

  function setDirty(dirty) {
    isDirty = dirty;
    document.getElementById('unsavedBadge').style.display = dirty ? 'inline-block' : 'none';
  }

  function initYearDropdown(selectedTargetYear) {
    const yearSelect = document.getElementById('yearSelect');
    const today = new Date();
    let currYear = today.getFullYear() - 1911;
    if (today.getMonth() + 1 < 8) { currYear -= 1; }

    yearSelect.innerHTML = '';
    const startYear = currYear - 1;
    const endYear = currYear + 3;

    for (let y = startYear; y <= endYear; y++) {
      const yearStr = y + "學年度";
      const opt = document.createElement('option');
      opt.value = yearStr;
      opt.innerText = yearStr;
      if (selectedTargetYear && yearStr === selectedTargetYear) {
        opt.selected = true;
      } else if (!selectedTargetYear && y === currYear) {
        opt.selected = true;
      }
      yearSelect.appendChild(opt);
    }
  }

  async function adminLogin() {
    const pwdInput = document.getElementById('adminPassword');
    const loginMsg = document.getElementById('loginMsg');
    currentPassword = pwdInput.value.trim();

    if (!currentPassword) { 
      alert("請輸入後台管理密碼！"); 
      return; 
    }

    loginMsg.innerHTML = '<div class="text-info"><span class="spinner-border spinner-border-sm me-2"></span>驗證中...</div>';

    initYearDropdown();
    const success = await fetchYearConfig();
    if (success) {
      sessionStorage.setItem('adminPwd', currentPassword);
    }
  }

  function logout() {
    if (isDirty && !confirm("您有未儲存的變更，確定要登出嗎？")) return;
    sessionStorage.removeItem('adminPwd');
    location.reload();
  }

  async function onYearChange() {
    if (isDirty && !confirm("您有未儲存的變更，切換學年度將會遺失變更。確定要切換嗎？")) {
      document.getElementById('yearSelect').value = document.getElementById('editingYearTitle').innerText;
      return;
    }
    await fetchYearConfig();
  }

  async function fetchYearConfig() {
    const selectedYear = document.getElementById('yearSelect').value;
    const loginMsg = document.getElementById('loginMsg');
    const statusMsg = document.getElementById('statusMsg');

    document.getElementById('editingYearTitle').innerText = selectedYear;
    if (statusMsg) statusMsg.innerHTML = '';
    toggleLoading(true, `正在載入 ${selectedYear} 設定...`);

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'getAdminConfig',
          password: currentPassword,
          academicYear: selectedYear
        })
      });

      const res = await response.json();

      if (res.status === 'success') {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('controlPanel').style.display = 'block';
        loginMsg.innerHTML = '';
        
        globalActiveYear = res.activeYear;
        document.getElementById('currentActiveYearBadge').innerText = globalActiveYear;

        currentChannelsData = res.channels || [];
        setDirty(false);
        renderChannelsList();
        return true;
      } else {
        loginMsg.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
        return false;
      }
    } catch (err) {
      loginMsg.innerHTML = `<div class="alert alert-danger">連線失敗：${err.message || err}</div>`;
      return false;
    } finally {
      toggleLoading(false);
    }
  }

  function renderChannelsList() {
    const container = document.getElementById('channelsContainer');
    container.innerHTML = '';

    if (currentChannelsData.length === 0) {
      container.innerHTML = '<div class="text-muted text-center py-4 border border-secondary rounded">目前尚無任何管道，點擊右上角「+ 新增自訂管道」建立。</div>';
      return;
    }

    currentChannelsData.forEach((ch, idx) => {
      const row = document.createElement('div');
      row.className = `channel-row ${ch.enabled ? 'active-row' : ''}`;
      
      const isFirst = idx === 0;
      const isLast = idx === currentChannelsData.length - 1;
      const showDetails = ch.showDetails !== false; // 預設為 true

      row.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <span class="fs-5 fw-bold me-2">${ch.name}</span>
          <button class="btn btn-outline-secondary btn-action" onclick="editChannelName(${idx})" title="重新命名">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-outline-danger btn-action" onclick="deleteChannel(${idx})" title="刪除管道">
            <i class="bi bi-trash"></i>
          </button>
        </div>

        <div class="d-flex align-items-center gap-3">
          <!-- 排序按鈕 -->
          <div class="btn-group btn-group-sm me-2">
            <button class="btn btn-outline-light" onclick="moveChannel(${idx}, -1)" ${isFirst ? 'disabled' : ''} title="上移">
              <i class="bi bi-arrow-up"></i>
            </button>
            <button class="btn btn-outline-light" onclick="moveChannel(${idx}, 1)" ${isLast ? 'disabled' : ''} title="下移">
              <i class="bi bi-arrow-down"></i>
            </button>
          </div>

          <!-- 顯示科目細項 Switch -->
          <div class="form-check form-switch d-flex align-items-center m-0 me-2" title="開啟時前台將顯示科目細項供學生勾選">
            <input class="form-check-input me-1" type="checkbox" id="details_switch_${idx}" ${showDetails ? 'checked' : ''} onchange="toggleChannelDetails(${idx}, this.checked)">
            <label class="form-check-label small" for="details_switch_${idx}">
              ${showDetails ? '<span class="text-info">顯示細項</span>' : '<span class="text-muted">隱藏細項</span>'}
            </label>
          </div>

          <!-- 開放報名 Switch -->
          <div class="form-check form-switch d-flex align-items-center m-0">
            <input class="form-check-input me-2" type="checkbox" id="switch_${idx}" ${ch.enabled ? 'checked' : ''} onchange="toggleChannel(${idx}, this.checked)">
            <label class="form-check-label fw-bold" for="switch_${idx}" style="min-width: 60px;">
              ${ch.enabled ? '<span class="text-success">開放中</span>' : '<span class="text-muted">已關閉</span>'}
            </label>
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  }

  function toggleChannel(idx, isChecked) {
    currentChannelsData[idx].enabled = isChecked;
    setDirty(true);
    renderChannelsList();
  }

  function toggleChannelDetails(idx, isChecked) {
    currentChannelsData[idx].showDetails = isChecked;
    setDirty(true);
    renderChannelsList();
  }

  function editChannelName(idx) {
    const oldName = currentChannelsData[idx].name;
    const newName = prompt("請輸入新的管道名稱：", oldName);
    if (newName && newName.trim() && newName.trim() !== oldName) {
      const name = newName.trim();
      if (currentChannelsData.some((c, i) => i !== idx && c.name === name)) {
        alert("該管道名稱已存在！");
        return;
      }
      currentChannelsData[idx].name = name;
      setDirty(true);
      renderChannelsList();
    }
  }

  function deleteChannel(idx) {
    const targetName = currentChannelsData[idx].name;
    if (confirm(`確定要刪除【${targetName}】管道嗎？\n（儲存發布後將生效）`)) {
      currentChannelsData.splice(idx, 1);
      setDirty(true);
      renderChannelsList();
    }
  }

  function moveChannel(idx, direction) {
    const newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= currentChannelsData.length) return;
    
    const temp = currentChannelsData[idx];
    currentChannelsData[idx] = currentChannelsData[newIdx];
    currentChannelsData[newIdx] = temp;
    
    setDirty(true);
    renderChannelsList();
  }

  async function setAsActiveYear() {
    const selectedYear = document.getElementById('yearSelect').value;
    if (!confirm(`確定要將【${selectedYear}】設定為前台學生目前填報的學年度嗎？\n（前台網頁將全面切換至此學年度）`)) return;

    toggleLoading(true, "正在更新前台學年度設定...");
    const statusMsg = document.getElementById('statusMsg');

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'setActiveYear',
          password: currentPassword,
          academicYear: selectedYear
        })
      });

      const res = await response.json();

      if (res.status === 'success') {
        globalActiveYear = selectedYear;
        document.getElementById('currentActiveYearBadge').innerText = globalActiveYear;
        statusMsg.innerHTML = `<div class="alert alert-success text-center"><i class="bi bi-check-circle me-1"></i>${res.message}</div>`;
      } else {
        statusMsg.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
      }
    } catch (err) {
      statusMsg.innerHTML = `<div class="alert alert-danger">設定失敗：${err.message || err}</div>`;
    } finally {
      toggleLoading(false);
    }
  }

  function addCustomChannelPrompt() {
    const newName = prompt("請輸入欲新增的升學管道名稱（例如：校內繁星推薦、特殊選才二階段）：");
    if (newName && newName.trim()) {
      const name = newName.trim();
      if (currentChannelsData.some(c => c.name === name)) {
        alert("該管道名稱已存在！");
        return;
      }
      currentChannelsData.push({ name: name, enabled: true, showDetails: true });
      setDirty(true);
      renderChannelsList();
    }
  }

  function addNewYearPrompt() {
    const yearNum = prompt("請輸入欲新增的民國學年度數字（例如：116）：");
    if (yearNum && !isNaN(yearNum.trim())) {
      const newYearText = yearNum.trim() + "學年度";
      const yearSelect = document.getElementById('yearSelect');
      
      let exists = false;
      for (let i = 0; i < yearSelect.options.length; i++) {
        if (yearSelect.options[i].value === newYearText) {
          exists = true;
          yearSelect.options[i].selected = true;
          break;
        }
      }

      if (!exists) {
        const opt = document.createElement('option');
        opt.value = newYearText;
        opt.innerText = newYearText;
        opt.selected = true;
        yearSelect.appendChild(opt);
      }

      onYearChange();
    }
  }

  async function deleteCurrentYearConfig() {
    const selectedYear = document.getElementById('yearSelect').value;
    if (!confirm(`確定要刪除【${selectedYear}】的所有管道設定資料嗎？此操作不可復原！`)) return;

    toggleLoading(true, `正在刪除 ${selectedYear} 設定...`);
    const statusMsg = document.getElementById('statusMsg');

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'deleteAcademicYear',
          password: currentPassword,
          academicYear: selectedYear
        })
      });

      const res = await response.json();

      if (res.status === 'success') {
        alert(res.message);
        initYearDropdown();
        await fetchYearConfig();
      } else {
        statusMsg.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
      }
    } catch (err) {
      statusMsg.innerHTML = `<div class="alert alert-danger">刪除失敗：${err.message || err}</div>`;
    } finally {
      toggleLoading(false);
    }
  }

  async function saveConfig() {
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');
    const selectedYear = document.getElementById('yearSelect').value;

    toggleLoading(true, "儲存中，請稍候...");
    statusMsg.innerHTML = '';

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'saveAdminConfig',
          password: currentPassword,
          academicYear: selectedYear,
          channels: currentChannelsData
        })
      });

      const res = await response.json();

      if (res.status === 'success') {
        setDirty(false);
        statusMsg.innerHTML = `<div class="alert alert-success fs-5 text-center"><i class="bi bi-check-circle-fill me-2"></i>${res.message}</div>`;
      } else {
        statusMsg.innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
      }
    } catch (err) {
      statusMsg.innerHTML = `<div class="alert alert-danger">儲存失敗：${err.message || err}</div>`;
    } finally {
      toggleLoading(false);
    }
  }
</script>

</body>
</html>
